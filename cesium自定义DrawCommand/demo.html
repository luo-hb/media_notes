<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Include the CesiumJS JavaScript and CSS files -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Cesium.js"></script>
    <link
      href="https://cesium.com/downloads/cesiumjs/releases/1.131/Build/Cesium/Widgets/widgets.css"
      rel="stylesheet"
    />

    <script src="https://cdn.bootcdn.net/ajax/libs/dat-gui/0.7.9/dat.gui.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/simplex-noise/2.4.0/simplex-noise.js"></script>
    <style>
      #cesiumContainer {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      #btnExportCamera {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 999;
        padding: 6px 12px;
      }
      #boxTitle {
        position: absolute;
        top: 12px;
        /* 水平居中核心 */
        left: 50%;
        transform: translateX(-50%);
        z-index: 999;
        padding: 6px 12px;
        font-weight: bold;
        color: #fff;
        font-size: 26px;
        background: rgba(0, 0, 0, 0.6); /* 建议加半透明黑背景，文字看得更清楚 */
      }
    </style>
  </head>

  <body>
    <div id="cesiumContainer"></div>
    <button id="btnExportCamera">导出当前相机flyTo代码</button>
    <div id="boxTitle">cesium自定义DrawCommand-Primitive 实现画三角形</div>
    <script>
      window.onload = function () {
        const viewer = new Cesium.Viewer("cesiumContainer", {
          contextOptions: {
            requestWebgl2: true,
          },
        });
        // 显示帧率
        viewer.scene.debugShowFramesPerSecond = true;
        viewer.cesiumWidget.creditContainer.style.display = "none";

        // ========== 天地图配置 替换为你自己的key ==========
        const TDT_KEY = "ee9895821c1f9a8588f0528762a8f02b";

        const imgLayer = new Cesium.UrlTemplateImageryProvider({
          url:
            "https://t0.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILECOL={x}&TILEROW={y}&TILEMATRIX={z}&tk=" +
            TDT_KEY,
          tileMatrixWidth: 256,
          tileMatrixHeight: 256,
        });
        const ciaLayer = new Cesium.UrlTemplateImageryProvider({
          url:
            "https://t0.tianditu.gov.cn/cia_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=cia&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILECOL={x}&TILEROW={y}&TILEMATRIX={z}&tk=" +
            TDT_KEY,
          tileMatrixWidth: 256,
          tileMatrixHeight: 256,
        });
        viewer.imageryLayers.addImageryProvider(imgLayer);
        // viewer.imageryLayers.addImageryProvider(ciaLayer);

        // viewer.camera.flyTo({
        //   destination: Cesium.Cartesian3.fromDegrees(112, 23, 1000), // 直接设置高度1000
        //   orientation: {
        //     heading: Cesium.Math.toRadians(0), // 朝向正北
        //     pitch: Cesium.Math.toRadians(-90), // 俯视朝下，垂直看地面
        //     roll: 0,
        //   },
        //   duration: 2, // 飞行时间，秒
        // });

        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            111.623262,
            21.813223,
            54798.85,
          ),
          orientation: {
            heading: Cesium.Math.toRadians(19.3346),
            pitch: Cesium.Math.toRadians(-20.7536),
            roll: Cesium.Math.toRadians(359.9952),
          },
          duration: 0, // 飞行时间，秒
        });



        // 知乎-岭南灯火  https://zhuanlan.zhihu.com/p/506759873  1.6. 我们来实践一发纯色三角形
        const modelCenter = Cesium.Cartesian3.fromDegrees(112, 23, 0);
        const modelMatrix =
          Cesium.Transforms.eastNorthUpToFixedFrame(modelCenter);

        const vertexShaderText = `// attribute vec3 position;
                              in vec3 position;  //改动1
       void main() {
         gl_Position = czm_projection * czm_view * czm_model * vec4(position, 1.0);
       }`;
        const fragmentShaderText = `uniform vec3 u_color;
       void main(){
        //  gl_FragColor = vec4(u_color, 1.0);  //改动2
        out_FragColor  = vec4(u_color, 1.0);
       }`;

        const createCommand = (frameState, matrix) => {
          const attributeLocations = {
            position: 0,
          };
          const uniformMap = {
            u_color() {
              return Cesium.Color.HONEYDEW;
            },
          };
          const positionBuffer = Cesium.Buffer.createVertexBuffer({
            usage: Cesium.BufferUsage.STATIC_DRAW,
            typedArray: new Float32Array([
              10000, 50000, 5000, -20000, -10000, 5000, 50000, -30000, 5000,
            ]),
            context: frameState.context,
          });
          const vertexArray = new Cesium.VertexArray({
            context: frameState.context,
            attributes: [
              {
                index: 0, // 等于 attributeLocations['position']
                vertexBuffer: positionBuffer,
                componentsPerAttribute: 3,
                componentDatatype: Cesium.ComponentDatatype.FLOAT,
              },
            ],
          });
          const program = Cesium.ShaderProgram.fromCache({
            context: frameState.context,
            vertexShaderSource: vertexShaderText,
            fragmentShaderSource: fragmentShaderText,
            attributeLocations: attributeLocations,
          });
          const renderState = Cesium.RenderState.fromCache({
            depthTest: {
              enabled: true,
            },
          });
          return new Cesium.DrawCommand({
            modelMatrix: matrix,
            vertexArray: vertexArray,
            shaderProgram: program,
            uniformMap: uniformMap,
            renderState: renderState,
            pass: Cesium.Pass.OPAQUE,
          });
        };

        /* ----- See Here ↓ ------ */

        class StaticTrianglePrimitive {
          /**
           * @param {Matrix4} modelMatrix matrix to WorldCoordinateSystem
           */
          constructor(modelMatrix) {
            this._modelMatrix = modelMatrix;
          }
          isDestroyed() { //改动3
            return false;
          }
          /**
           * @param {FrameState} frameState
           */
          update(frameState) {
            const command = createCommand(frameState, this._modelMatrix);
            frameState.commandList.push(command);
          }
        }

        viewer.scene.globe.depthTestAgainstTerrain = true;
        viewer.scene.primitives.add(new StaticTrianglePrimitive(modelMatrix));
        // 知乎结束


        // ====================== 新增按钮逻辑 ======================
        const btn = document.getElementById("btnExportCamera");
        btn.addEventListener("click", () => {
          const camera = viewer.camera;
          const cartographic = Cesium.Cartographic.fromCartesian(
            camera.position,
          );
          const lon = Cesium.Math.toDegrees(cartographic.longitude);
          const lat = Cesium.Math.toDegrees(cartographic.latitude);
          const height = cartographic.height;

          const headingDeg = Cesium.Math.toDegrees(camera.heading);
          const pitchDeg = Cesium.Math.toDegrees(camera.pitch);
          const rollDeg = Cesium.Math.toDegrees(camera.roll);

          // 输出完整flyTo代码片段
          const codeStr = `viewer.camera.flyTo({
  destination: Cesium.Cartesian3.fromDegrees(${lon.toFixed(6)}, ${lat.toFixed(6)}, ${height.toFixed(2)}),
  orientation: {
    heading: Cesium.Math.toRadians(${headingDeg.toFixed(4)}),
    pitch: Cesium.Math.toRadians(${pitchDeg.toFixed(4)}),
    roll: Cesium.Math.toRadians(${rollDeg.toFixed(4)}),
  },
});`;
          console.log("==== 当前视角flyTo代码 ====");
          console.log(codeStr);
          alert("已输出到浏览器控制台(F12)，复制代码即可使用");
        });
      };
    </script>
  </body>
</html>
