<body>

<div id="hud">
  <h1>全国车牌标签 · 34 省级汉字 · WebGL2 + MSDF 实例化</h1>
  <p>全部车牌共享 1 份模板几何体与 1 份 MSDF 图集材质（70 字形），GPU 实例化</p>
</div>

<div id="panel">
  <h2>控制台</h2>
  <div class="row"><label>车牌数量</label><input type="range" id="countRange" min="10" max="3000" step="10" value="400"><output id="countOut">400</output></div>
  <div class="row"><label>行驶速度</label><input type="range" id="speedRange" min="0" max="4" step="0.1" value="1"><output id="speedOut">1.0</output></div>
  <div class="plates">
    <div class="row" style="margin-top:10px"><label>前 3 辆示例车牌</label></div>
    <input id="p0" maxlength="8" value="京A12345" spellcheck="false">
    <input id="p1" maxlength="8" value="粤B88888" spellcheck="false">
    <input id="p2" maxlength="8" value="沪C00001" spellcheck="false">
  </div>
  <div class="btns">
    <button id="applyBtn">应用车牌</button>
    <button id="resetBtn" class="ghost">重置视角</button>
  </div>
  <div id="stats">实例：—　车牌绘制批次：1<br>模板顶点：36 · 三角形：18</div>
</div>

/* ================================================================
 * 3. 由图集 JSON 生成 glyphUVs（yOrigin=bottom，纹理 flipY=true）
 * ==============================================================*/
function buildGlyphUVs(atlasJson) {
  var meta = atlasJson.atlas;
  var byUnicode = {};
  atlasJson.glyphs.forEach(function (g) { byUnicode[g.unicode] = g; });
  var uvs = [];
  for (var i = 0; i < glyphChars.length; i++) {
    var cp = glyphChars[i].codePointAt(0);
    var glyph = byUnicode[cp];
    if (!glyph) throw new Error("图集缺少字形: " + glyphChars[i]);
    var b = glyph.atlasBounds;
    var u0 = b.left / meta.width;
    var u1 = b.right / meta.width;
    var v0 = meta.yOrigin === "bottom" ? b.bottom / meta.height : 1 - b.bottom / meta.height;
    var v1 = meta.yOrigin === "bottom" ? b.top / meta.height : 1 - b.top / meta.height;
    uvs.push(new THREE.Vector4(u0, v0, u1, v1));
  }
  return { uvs: uvs, meta: meta };
}

/* ================================================================
 * 4. 模板几何体：1 个背景 Quad + 8 个字符槽 Quad（全部在原点）
 * ==============================================================*/
function buildPlateGeometry() {
  var quadCount = MAX_CHARS + 1;
  var vertexCount = quadCount * 4;
  var positions = new Float32Array(vertexCount * 3);
  var uvs = new Float32Array(vertexCount * 2);
  var charSlots = new Float32Array(vertexCount);
  var backgrounds = new Float32Array(vertexCount);
  var indices = new Uint16Array(quadCount * 6);
  var quadPos = [-0.5, -0.5, 0, 0.5, -0.5, 0, 0.5, 0.5, 0, -0.5, 0.5, 0];
  var quadUv = [0, 0, 1, 0, 1, 1, 0, 1];
  for (var q = 0; q < quadCount; q++) {
    var v = q * 4;
    positions.set(quadPos, v * 3);
    uvs.set(quadUv, v * 2);
    var isBg = q === 0 ? 1 : 0;
    for (var k = 0; k < 4; k++) { backgrounds[v + k] = isBg; charSlots[v + k] = isBg ? -1 : q - 1; }
    indices.set([v, v + 1, v + 2, v, v + 2, v + 3], q * 6);
  }
  var geo = new THREE.BufferGeometry();
  geo.setIndex(new THREE.BufferAttribute(indices, 1));
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.setAttribute("uv", new THREE.BufferAttribute(uvs, 2));
  geo.setAttribute("charSlot", new THREE.BufferAttribute(charSlots, 1));
  geo.setAttribute("isBackground", new THREE.BufferAttribute(backgrounds, 1));
  return geo;
}

/* ================================================================
 * 5. 实例属性：两个 vec4 存 8 个字符槽 + 占用长度
 * ==============================================================*/
function attachPlateAttributes(geometry, capacity) {
  var g0 = new THREE.InstancedBufferAttribute(new Float32Array(capacity * 4).fill(EMPTY_GLYPH), 4);
  var g1 = new THREE.InstancedBufferAttribute(new Float32Array(capacity * 4).fill(EMPTY_GLYPH), 4);
  var vis = new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1);
  [g0, g1, vis].forEach(function (a) { a.setUsage(THREE.DynamicDrawUsage); });
  geometry.setAttribute("aGlyphSet0", g0);
  geometry.setAttribute("aGlyphSet1", g1);
  geometry.setAttribute("aVisibleCount", vis);
  return { glyph0: g0, glyph1: g1, visible: vis };
}

function writePlateText(attributes, instanceIndex, text) {
  var chars = Array.from(text);
  if (chars.length > MAX_CHARS) throw new RangeError("车牌最多 8 字符");
  var base = instanceIndex * 4;
  for (var slot = 0; slot < MAX_CHARS; slot++) {
    var idx = slot < chars.length ? glyphMap[chars[slot]] : EMPTY_GLYPH;
    var arr = slot < 4 ? attributes.glyph0.array : attributes.glyph1.array;
    arr[base + slot % 4] = idx;
  }
  attributes.visible.array[instanceIndex] = chars.length;
  attributes.glyph0.addUpdateRange(base, 4);
  attributes.glyph1.addUpdateRange(base, 4);
  attributes.visible.addUpdateRange(instanceIndex, 1);
  attributes.glyph0.needsUpdate = true;
  attributes.glyph1.needsUpdate = true;
  attributes.visible.needsUpdate = true;
}

/* ================================================================
 * 6. 完整着色器（选字 / 居中 / 背景伸缩 / 视空间 Billboard / MSDF）
 * ==============================================================*/
function createVertexShader() {
  return [
    "precision highp float;",
    "precision highp int;",
    "in vec3 position;",
    "in vec2 uv;",
    "in float charSlot;",
    "in float isBackground;",
    "in mat4 instanceMatrix;",
    "in vec4 aGlyphSet0;",
    "in vec4 aGlyphSet1;",
    "in float aVisibleCount;",
    "uniform mat4 modelMatrix;",
    "uniform mat4 modelViewMatrix;",
    "uniform mat4 projectionMatrix;",
    "uniform float uLabelScale;",
    "uniform float uCharSpacing;",
    "uniform float uPadding;",
    "uniform float uUseWorldScale;",
    "uniform vec4 uGlyphUVs[" + glyphChars.length + "];",
    "out vec2 vUv;",
    "flat out float vIsBackground;",
    "void main() {",
    "  vUv = uv;",
    "  vIsBackground = isBackground;",
    "  if (aVisibleCount < 0.5) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }",
    "  vec2 localOffset = position.xy;",
    "  if (isBackground > 0.5) {",
    "    float contentWidth = (aVisibleCount - 1.0) * uCharSpacing + 1.0;",
    "    localOffset *= vec2(contentWidth + 2.0 * uPadding, 1.0 + 2.0 * uPadding);",
    "  } else {",
    "    int slot = int(charSlot);",
    "    float glyphIndex;",
    "    if (slot < 4) { glyphIndex = aGlyphSet0[slot]; } else { glyphIndex = aGlyphSet1[slot - 4]; }",
    "    if (charSlot >= aVisibleCount || glyphIndex < 0.0 || glyphIndex >= " + glyphChars.length + ".0) {",
    "      gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return;",
    "    }",
    "    float centerOffset = (aVisibleCount - 1.0) * 0.5 * uCharSpacing;",
    "    localOffset.x += charSlot * uCharSpacing - centerOffset;",
    "    vec4 bounds = uGlyphUVs[int(glyphIndex)];",
    "    vUv = mix(bounds.xy, bounds.zw, uv);",
    "  }",
    "  vec2 scale = vec2(uLabelScale);",
    "  if (uUseWorldScale > 0.5) {",
    "    mat4 worldMatrix = modelMatrix * instanceMatrix;",
    "    scale *= vec2(length(worldMatrix[0].xyz), length(worldMatrix[1].xyz));",
    "  }",
    "  vec4 centerView = modelViewMatrix * (instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0));",
    "  vec4 vertexView = centerView + vec4(localOffset * scale, 0.0, 0.0);",
    "  gl_Position = projectionMatrix * vertexView;",
    "}"
  ].join("\n");
}

var fragmentShader = [
  "precision highp float;",
  "uniform sampler2D uAtlas;",
  "uniform vec2 uUnitRange;",
  "uniform vec3 uTextColor;",
  "uniform vec4 uBackgroundColor;",
  "in vec2 vUv;",
  "flat in float vIsBackground;",
  "out vec4 fragColor;",
  "void main() {",
  "  vec2 footprint = max(fwidth(vUv), vec2(0.000001));",
  "  float screenRange = max(dot(uUnitRange / footprint, vec2(0.5)), 1.0);",
  "  if (vIsBackground > 0.5) { fragColor = uBackgroundColor; return; }",
  "  vec3 sampleValue = texture(uAtlas, vUv).rgb;",
  "  float middle = max(min(sampleValue.r, sampleValue.g), min(max(sampleValue.r, sampleValue.g), sampleValue.b));",
  "  float coverage = clamp((middle - 0.5) * screenRange + 0.5, 0.0, 1.0);",
  "  if (coverage <= 0.0) discard;",
  "  fragColor = vec4(uTextColor, coverage);",
  "}"
].join("\n");

/* ================================================================
 * 7. createPlateLabels：一个 InstancedMesh 承载全部车牌
 * ==============================================================*/
function createPlateLabels(capacity, atlasData) {
  var geometry = buildPlateGeometry();
  var attributes = attachPlateAttributes(geometry, capacity);
  var material = new THREE.RawShaderMaterial({
    glslVersion: THREE.GLSL3,
    vertexShader: createVertexShader(),
    fragmentShader: fragmentShader,
    uniforms: {
      uAtlas: { value: atlasData.texture },
      uGlyphUVs: { value: atlasData.uvs },
      uUnitRange: { value: new THREE.Vector2(atlasData.meta.distanceRange / atlasData.meta.width, atlasData.meta.distanceRange / atlasData.meta.height) },
      uTextColor: { value: new THREE.Vector3(1, 1, 1) },
      uBackgroundColor: { value: new THREE.Vector4(0.02, 0.12, 0.36, 0.94) },
      uLabelScale: { value: 0.55 },
      uCharSpacing: { value: 1.0 },
      uPadding: { value: 0.32 },
      uUseWorldScale: { value: 1 }
    },
    transparent: true,
    depthTest: true,
    depthWrite: false,
    side: THREE.FrontSide,
    toneMapped: false
  });
  var mesh = new THREE.InstancedMesh(geometry, material, capacity);
  mesh.count = 0;
  mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mesh.frustumCulled = false;
  var texts = new Array(capacity).fill(null);
  var matrix = new THREE.Matrix4();
  function setText(index, text) {
    if (index < 0 || index >= capacity) return;
    if (texts[index] === text) return;
    var chars = Array.from(text);
    if (chars.length > MAX_CHARS) chars = chars.slice(0, MAX_CHARS);
    for (var i = 0; i < chars.length; i++) if (glyphMap[chars[i]] === undefined) return;
    writePlateText(attributes, index, chars.join(""));
    texts[index] = chars.join("");
    mesh.count = Math.max(mesh.count, index + 1);
  }
  function setPosition(index, x, y, z) {
    matrix.makeTranslation(x, y, z);
    mesh.setMatrixAt(index, matrix);
    mesh.instanceMatrix.addUpdateRange(index * 16, 16);
    mesh.instanceMatrix.needsUpdate = true;
    mesh.count = Math.max(mesh.count, index + 1);
  }
  return {
    mesh: mesh, setText: setText, setPosition: setPosition,
    hide: function (i) { setText(i, ""); }
  };
}

var carBodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
var carTopMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
var carBodies = new THREE.InstancedMesh(carBodyGeo, carBodyMat, MAX_VEHICLES);
var carTops = new THREE.InstancedMesh(carTopGeo, carTopMat, MAX_VEHICLES);
carBodies.count = 0; carTops.count = 0;
carBodies.frustumCulled = false; carTops.frustumCulled = false;
scene.add(carBodies); scene.add(carTops);
var carMatrix = new THREE.Matrix4();
var carColor = new THREE.Color();

/* ================================================================
 * 9. 加载内嵌 MSDF 图集并创建车牌系统
 * ==============================================================*/
var plateSystem = null;
var statusEl = document.getElementById("stats");

new THREE.TextureLoader().load(ATLAS_PNG_DATAURL, function (texture) {
  try {
    var atlasData = buildGlyphUVs(ATLAS_JSON);
    if (texture.image.width !== atlasData.meta.width || texture.image.height !== atlasData.meta.height) {
      throw new Error("图集 PNG 尺寸与 JSON 不一致");
    }
    texture.flipY = true;
    texture.colorSpace = THREE.NoColorSpace;
    texture.minFilter = THREE.LinearFilter;
    texture.magFilter = THREE.LinearFilter;
    texture.generateMipmaps = false;
    texture.needsUpdate = true;
    atlasData.texture = texture;

    plateSystem = createPlateLabels(MAX_VEHICLES, atlasData);
    scene.add(plateSystem.mesh);
    applyConfig(parseInt(countRange.value, 10));
    startLoop();
    statusEl.innerHTML = "WebGL2 · 图集 1024×1024 · " + glyphChars.length + " 字形（含 34 省级汉字）· 距离场 8px<br>实例：—　车牌绘制批次：1<br>模板顶点：36 · 三角形：18";
  } catch (e) {
    statusEl.textContent = "图集初始化失败: " + e.message;
    console.error(e);
  }
});

/* ================================================================
 * 10. 配置布局：数量 + 示例车牌文本
 * ==============================================================*/
var PROVINCES = "京津沪渝冀晋蒙辽吉黑苏浙皖闽赣鲁豫鄂湘粤桂琼川贵云藏陕甘青宁新台港澳";
// 34 个省级行政区各一块示例车牌（汉字 + 发牌机关字母 + 5 位编号）
var PROVINCE_PLATES = [
  "京A12345", "津B12345", "沪C12345", "渝D12345",
  "冀E12345", "晋F12345", "蒙G12345", "辽H12345",
  "吉J12345", "黑K12345", "苏L12345", "浙M12345",
  "皖N12345", "闽P12345", "赣Q12345", "鲁R12345",
  "豫S12345", "鄂T12345", "湘U12345", "粤V12345",
  "桂W12345", "琼X12345", "川Y12345", "贵Z12345",
  "云A67890", "藏B67890", "陕C67890", "甘D67890",
  "青E67890", "宁F67890", "新G67890", "台H67890",
  "港J67890", "澳K67890"
];
// 确定性伪随机车牌：省份 + 字母 + 5 位数字
function randomPlate(i) {
  var letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  var p = PROVINCES[(i * 7 + 3) % PROVINCES.length];
  var l = letters[(i * 13 + 5) % letters.length];
  var n = String((i * 7919 + 1234) % 100000).padStart(5, "0");
  return p + l + n;
}

var phases = new Float32Array(MAX_VEHICLES);
var amps = new Float32Array(MAX_VEHICLES);
var rowsOf = new Int32Array(MAX_VEHICLES);

function applyConfig(count, customTexts) {
  if (!plateSystem) return;
  count = Math.max(10, Math.min(MAX_VEHICLES, count));
  var cols = Math.ceil(Math.sqrt(count * 1.2));
  var spacingX = 4.6, spacingZ = 3.6;
  var offsets = []; // 预生成文本：前3个自定义，前34辆为省份示例，其余随机
  for (var i = 0; i < count; i++) {
    var row = Math.floor(i / cols), col = i % cols;
    var x = (col - (cols - 1) / 2) * spacingX;
    var z = (row - (Math.ceil(count / cols) - 1) / 2) * spacingZ;
    var phase = ((i * 37) % 1000) / 1000 * Math.PI * 2;
    var amp = 5 + (row % 4) * 3.5;
    phases[i] = phase; amps[i] = amp; rowsOf[i] = row;
    var text;
    if (customTexts && customTexts[i]) text = customTexts[i];
    else if (i < PROVINCE_PLATES.length) text = PROVINCE_PLATES[i];
    else text = randomPlate(i);
    plateSystem.setText(i, text);
    plateSystem.setPosition(i, x, 2.0, z);
    // 车辆
    carMatrix.makeTranslation(x, 0.5, z);
    carBodies.setMatrixAt(i, carMatrix);
    carMatrix.makeTranslation(x, 1.32, z);
    carTops.setMatrixAt(i, carMatrix);
    carColor.setHSL(((i * 0.618) % 1), 0.38, 0.52);
    carBodies.setColorAt(i, carColor);
    carColor.setHSL(((i * 0.618 + 0.5) % 1), 0.22, 0.42);
    carTops.setColorAt(i, carColor);
  }
  plateSystem.mesh.count = count;
  carBodies.count = count;
  carTops.count = count;
  carBodies.instanceMatrix.needsUpdate = true;
  carTops.instanceMatrix.needsUpdate = true;
  if (carBodies.instanceColor) carBodies.instanceColor.needsUpdate = true;
  if (carTops.instanceColor) carTops.instanceColor.needsUpdate = true;
  countOut.textContent = count;
  statsLine(count);
}

function statsLine(count) {
  statusEl.innerHTML = "WebGL2 · 图集 1024×1024 · " + glyphChars.length + " 字形（含 34 省级汉字）· 距离场 8px<br>实例：" + count + "　车牌绘制批次：1<br>模板顶点：36 · 三角形：18";
}

/* ================================================================
 * 11. 轨道控制（拖拽旋转 / 滚轮缩放，限位）
 * ==============================================================*/
var cam = { theta: 0.55, phi: 1.12, radius: 40, target: new THREE.Vector3(0, 1.6, 0) };
var isDrag = false, lastX = 0, lastY = 0;
function applyCamera() {
  var sp = Math.sin(cam.phi), cp = Math.cos(cam.phi);
  camera.position.set(
    cam.target.x + cam.radius * sp * Math.sin(cam.theta),
    cam.target.y + cam.radius * cp,
    cam.target.z + cam.radius * sp * Math.cos(cam.theta)
  );
  camera.lookAt(cam.target);
}
function onDown(x, y) { isDrag = true; lastX = x; lastY = y; }
function onMove(x, y) {
  if (!isDrag) return;
  cam.theta -= (x - lastX) * 0.005;
  cam.phi += (y - lastY) * 0.005;
  cam.phi = Math.max(0.15, Math.min(1.5, cam.phi));
  lastX = x; lastY = y;
}
function onUp() { isDrag = false; }
function onWheel(d) {
  cam.radius *= Math.exp(d * 0.0012);
  cam.radius = Math.max(7, Math.min(90, cam.radius));
}
renderer.domElement.addEventListener("pointerdown", function (e) { onDown(e.clientX, e.clientY); renderer.domElement.setPointerCapture(e.pointerId); });
window.addEventListener("pointermove", function (e) { onMove(e.clientX, e.clientY); });
window.addEventListener("pointerup", onUp);
renderer.domElement.addEventListener("wheel", function (e) { e.preventDefault(); onWheel(e.deltaY); }, { passive: false });
renderer.domElement.addEventListener("touchstart", function (e) { if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
renderer.domElement.addEventListener("touchmove", function (e) { if (e.touches.length === 1) onMove(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
renderer.domElement.addEventListener("touchend", onUp);

/* ================================================================
 * 12. UI 绑定
 * ==============================================================*/
var countRange = document.getElementById("countRange");
var countOut = document.getElementById("countOut");
var speedRange = document.getElementById("speedRange");
var speedOut = document.getElementById("speedOut");
var applyBtn = document.getElementById("applyBtn");
var resetBtn = document.getElementById("resetBtn");

countRange.addEventListener("input", function () {
  countOut.textContent = countRange.value;
  applyConfig(parseInt(countRange.value, 10));
});
speedRange.addEventListener("input", function () { speedOut.textContent = parseFloat(speedRange.value).toFixed(1); });
applyBtn.addEventListener("click", function () {
  var customs = [document.getElementById("p0").value, document.getElementById("p1").value, document.getElementById("p2").value];
  applyConfig(parseInt(countRange.value, 10), customs);
});
resetBtn.addEventListener("click", function () {
  cam.theta = 0.55; cam.phi = 1.12; cam.radius = 40;
  cam.target.set(0, 1.6, 0);
});

/* ================================================================
 * 13. 动画循环：车辆移动只更新实例矩阵，文字/几何/图集不重建
 * ==============================================================*/
var running = false;
function startLoop() {
  if (running) return;
  running = true;
  renderer.setAnimationLoop(function (timeMs) {
    var t = timeMs * 0.001;
    var speed = parseFloat(speedRange.value);
    var count = plateSystem ? plateSystem.mesh.count : 0;
    for (var i = 0; i < count; i++) {
      var x = Math.sin(t * speed + phases[i]) * amps[i];
      var z = rowsOf[i] * 3.6 - ((Math.ceil(count / Math.ceil(Math.sqrt(count * 1.2))) - 1) / 2) * 3.6;
      plateSystem.setPosition(i, x, 2.0, z);
      carMatrix.makeTranslation(x, 0.5, z);
      carBodies.setMatrixAt(i, carMatrix);
      carMatrix.makeTranslation(x, 1.32, z);
      carTops.setMatrixAt(i, carMatrix);
    }
    if (count > 0) {
      carBodies.instanceMatrix.needsUpdate = true;
      carTops.instanceMatrix.needsUpdate = true;
    }
    applyCamera();
    renderer.render(scene, camera);
  });
}

/* 首帧兜底：图集就绪前也渲染一帧（地面 + 光照），避免黑屏 */
applyCamera();
renderer.render(scene, camera);

window.addEventListener("resize", function () {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
