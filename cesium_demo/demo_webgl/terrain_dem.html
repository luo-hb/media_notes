<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据挤压 · GPU 高性能计算 DEM 材质高度 · WebGL2</title>
    <style>
        :root {
            --acc: #6ee7ff;
            --acc-dim: rgba(110, 231, 255, 0.18);
            --panel: rgba(10, 15, 24, 0.82);
            --bd: rgba(120, 160, 200, 0.16);
            --txt: #c9d8e6;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: #04060b; color: var(--txt); font-family: 'Segoe UI', 'Microsoft Yahei', system-ui, sans-serif; overflow: hidden; user-select: none; }
        canvas { width: 100vw; height: 100vh; display: block; cursor: grab; }
        canvas:active { cursor: grabbing; }
        #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 5;
            background: radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(0,0,0,0.55) 100%); }

        /* ---------- 顶部标题 ---------- */
        #title {
            position: fixed; top: 24px; right: 28px; z-index: 10; text-align: right; user-select: none; pointer-events: none;
        }
        #title .main {
            font-size: 21px; font-weight: 600; letter-spacing: 3px;
            background: linear-gradient(90deg, #9fd8ff, #6ee7ff 45%, #b7a6ff);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 0 12px rgba(110, 231, 255, 0.35));
        }
        #title .sub { font-size: 11px; letter-spacing: 4px; color: rgba(180, 205, 225, 0.55); margin-top: 5px; font-family: Consolas, monospace; }

        /* ---------- 控制面板 ---------- */
        #ui {
            position: absolute; top: 24px; left: 24px; z-index: 10;
            width: 348px; max-height: calc(100vh - 48px); overflow-y: auto;
            background: var(--panel); backdrop-filter: blur(14px);
            border: 1px solid var(--bd); border-radius: 14px; padding: 18px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        #ui::-webkit-scrollbar { width: 5px; }
        #ui::-webkit-scrollbar-thumb { background: rgba(110,231,255,0.25); border-radius: 3px; }

        #status {
            padding: 9px; background: rgba(110, 231, 255, 0.06); border: 1px solid var(--bd);
            text-align: center; border-radius: 8px; margin-bottom: 16px; font-size: 12px;
            min-height: 36px; display: flex; align-items: center; justify-content: center;
            color: #a9c6da;
        }
        .loading { color: #ff8f6e !important; animation: blink 1.1s infinite; }
        @keyframes blink { 50% { opacity: 0.45; } }

        .sec-title {
            font-size: 10px; letter-spacing: 3px; color: rgba(160, 195, 220, 0.5);
            margin: 16px 0 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(120,160,200,0.1);
            font-family: Consolas, monospace;
        }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
        .value { color: var(--acc); font-weight: 600; font-family: Consolas, monospace; }

        .btn {
            display: block; width: 100%; padding: 9px; font-size: 13px;
            background: rgba(255, 255, 255, 0.04); border: 1px solid var(--bd);
            color: var(--txt); border-radius: 8px; cursor: pointer; margin-bottom: 8px;
            font-family: inherit; transition: all 0.18s; text-align: center; text-decoration: none;
        }
        .btn:hover { background: rgba(110, 231, 255, 0.09); border-color: rgba(110, 231, 255, 0.4); box-shadow: 0 0 14px rgba(110, 231, 255, 0.12); }
        .btn:active { transform: scale(0.98); }
        input[type="file"] { display: none; }
        .file-btn { background: rgba(110, 231, 255, 0.06); }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; margin: 8px 0 14px;
            background: linear-gradient(90deg, var(--acc), #b7a6ff); outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
            background: #e8f7ff; border: 2px solid var(--acc); cursor: pointer;
            box-shadow: 0 0 10px rgba(110, 231, 255, 0.6);
        }

        /* ---------- 分段切换（贴图模式） ---------- */
        .segment { display: flex; background: rgba(255,255,255,0.03); border: 1px solid var(--bd); border-radius: 9px; padding: 3px; margin-bottom: 12px; }
        .segment button {
            flex: 1; padding: 8px 0; font-size: 13px; border: none; border-radius: 7px; cursor: pointer;
            background: transparent; color: rgba(200, 220, 235, 0.55); font-family: inherit; transition: all 0.2s;
        }
        .segment button.active {
            background: linear-gradient(135deg, rgba(110,231,255,0.18), rgba(183,166,255,0.18));
            color: #eafaff; box-shadow: 0 0 12px rgba(110,231,255,0.15), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        /* ---------- 配色下拉框 ---------- */
        .dd { position: relative; margin-bottom: 10px; }
        .dd-head {
            display: flex; align-items: center; gap: 10px; padding: 9px 12px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--bd); border-radius: 8px; cursor: pointer;
            transition: all 0.18s;
        }
        .dd-head:hover { background: rgba(110,231,255,0.07); }
        .dd.open .dd-head { border-color: rgba(110,231,255,0.45); }
        .dd-head .name { font-size: 13px; min-width: 64px; }
        .dd-head .arrow { font-size: 9px; color: var(--acc); transition: transform 0.2s; }
        .dd.open .dd-head .arrow { transform: rotate(180deg); }
        .dd-list {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60;
            background: #0b1119; border: 1px solid rgba(110,231,255,0.25); border-radius: 10px; padding: 5px;
            display: none; box-shadow: 0 14px 36px rgba(0,0,0,0.65);
            animation: ddIn 0.16s ease-out;
        }
        @keyframes ddIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        .dd.open .dd-list { display: block; }
        .dd-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
        .dd-item:hover { background: rgba(110,231,255,0.08); }
        .dd-item.sel { background: rgba(110,231,255,0.14); }
        .dd-item .name { font-size: 13px; min-width: 64px; }
        .dd-item .check { color: var(--acc); font-size: 11px; width: 14px; }
        .gradbar {
            flex: 1; height: 9px; border-radius: 5px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
        }
        .legend { display: flex; justify-content: space-between; font-size: 10px; color: rgba(160,195,220,0.55); font-family: Consolas, monospace; margin-top: -4px; margin-bottom: 10px; padding: 0 2px; }

        /* ---------- 图片纹理区 ---------- */
        #imgSection { display: none; }
        .img-preview-wrap { display: flex; gap: 10px; align-items: stretch; margin-bottom: 10px; }
        #previewImg {
            width: 96px; height: 96px; object-fit: cover; border-radius: 10px;
            border: 1px solid var(--bd); background: #0a0f16;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
        }
        .img-info { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-size: 11px; color: rgba(170,200,220,0.6); }
        .img-info .tag { color: var(--acc); font-family: Consolas, monospace; }

        /* ---------- 勾选框 ---------- */
        .check-row { display: flex; gap: 16px; margin: 10px 0 12px; }
        .check-item { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
        .check-item input { accent-color: var(--acc); cursor: pointer; }

        #debug { font-size: 11px; color: rgba(150,180,205,0.55); margin-top: 12px; border-top: 1px solid rgba(120,160,200,0.1); padding-top: 10px; font-family: Consolas, monospace; line-height: 1.7; }
        .hint { font-size: 11px; color: rgba(150,180,205,0.45); margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="status">就绪</div>

        <button class="btn" onclick="loadRemoteFile('1000.tif')">加载 1000.tif</button>
        <button class="btn" onclick="loadRemoteFile('250.tif')">加载 250.tif</button>
        <!-- 90.tif 150MB，超过100MB github上传不了 -->
        <label class="btn file-btn">📂 本地上传文件 <input type="file" id="fileInput" accept=".tif,.tiff"></label>

        <div class="row">解析耗时: <span id="t_worker" class="value">--</span></div>
        <div class="row" style="margin-bottom:0">显存同步: <span id="t_gpu" class="value">--</span></div>

        <div class="sec-title">RENDER · 渲染参数</div>
        <div class="row" style="margin-bottom:0">网格分辨率: <span id="resVal" class="value">200</span></div>
        <input type="range" id="resSlider" min="1" max="1000" value="200">
        <div class="row" style="margin-bottom:0">地形拉伸: <span id="zVal" class="value">8.0</span></div>
        <input type="range" id="zSlider" min="1" max="200" value="80">

        <div class="sec-title">TEXTURE · 贴图模式</div>
        <div class="segment">
            <button id="modeGrad" class="active" onclick="setTexMode('gradient')">🎨 渐变色贴图</button>
            <button id="modeImg" onclick="setTexMode('image')">🖼️ 图片纹理贴图</button>
        </div>

        <div id="gradSection">
            <div class="dd" id="dd">
                <div class="dd-head" onclick="toggleDD()">
                    <span class="name" id="ddName">经典地形</span>
                    <div class="gradbar" id="ddBar"></div>
                    <span class="arrow">▼</span>
                </div>
                <div class="dd-list" id="ddList"></div>
            </div>
            <div class="legend"><span id="legMin">--</span><span>海拔 (m)</span><span id="legMax">--</span></div>
        </div>

        <div id="imgSection">
            <div class="img-preview-wrap">
                <img id="previewImg" alt="纹理预览">
                <div class="img-info">
                    <div>网络随机图片 (picsum)</div>
                    <div class="tag" id="imgTag">未加载</div>
                </div>
            </div>
            <button class="btn" onclick="loadRandomImage()">🎲 刷新随机图片</button>
        </div>

        <div class="check-row">
            <label class="check-item"><input type="checkbox" id="chkContour"> 等高线</label>
            <label class="check-item"><input type="checkbox" id="chkRotate"> 自动旋转</label>
        </div>

        <button id="resetBtn" class="btn">🎥 重置视角</button>
        <button id="modeBtn" class="btn">/ 线框模式</button>

        <div id="debug">Ready.</div>
        <div class="hint">左键拖拽旋转 · 滚轮缩放</div>
    </div>

    <canvas id="glCanvas"></canvas>
    <div id="vignette"></div>
    <div id="title">
        <div class="main">数据挤压 · DEM 材质高度</div>
        <div class="sub">GPU HIGH-PERFORMANCE · WEBGL2</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/geotiff"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/2.8.1/gl-matrix-min.js"></script>

    <script>
        // --- 初始化 WebGL2 ---
        const canvas = document.getElementById('glCanvas');
        const gl = canvas.getContext('webgl2');
        if (!gl) { alert('您的浏览器不支持 WebGL 2'); }
        // R32F 浮点纹理默认不可线性过滤，需显式开启扩展；不支持则回退 NEAREST
        const floatLinear = gl.getExtension('OES_texture_float_linear');

        // --- 状态变量 ---
        let currentWorker = null;
        let heightTex = null;
        let heightW = 0, heightH = 0;
        let currentBuffers = null;
        let viewState = { rotX: -0.9, rotZ: 0, dist: 20 };
        let isDragging = false;
        let lastMouse = { x: 0, y: 0 };
        let sceneMin = 0, sceneMax = 3000;
        let zScale = 8.0;
        let currentRes = 200;
        let isWireframe = true;
        let texMode = 'gradient';           // 'gradient' | 'image'
        let gradTex = null;                  // 当前渐变色带纹理 (256x1)
        let imgTex = null;                   // 当前图片纹理
        let showContour = false;
        let autoRotate = false;

        // --- 配色方案（多段渐变色带） ---
        const colorPresets = [
            { name: "经典地形", stops: [[0, '#0b1e3d'], [0.28, '#1a6f4a'], [0.55, '#8a7a3a'], [0.78, '#7a4a2a'], [1, '#f5f5f5']] },
            { name: "火山熔岩", stops: [[0, '#0a0206'], [0.35, '#5c0e0e'], [0.62, '#e2431c'], [0.85, '#ff9e2c'], [1, '#ffe8a3']] },
            { name: "深海蓝绿", stops: [[0, '#02132b'], [0.4, '#073d54'], [0.72, '#0e8a8a'], [1, '#a8f0e0']] },
            { name: "等离子",   stops: [[0, '#14002e'], [0.35, '#6a00a8'], [0.62, '#e0345e'], [0.85, '#ff9e44'], [1, '#fcf7c2']] },
            { name: "灰度高程", stops: [[0, '#0a0a0a'], [0.5, '#777777'], [1, '#f2f2f2']] },
            { name: "翠谷",     stops: [[0, '#04150c'], [0.4, '#0f4d2a'], [0.7, '#5fae3c'], [0.9, '#c8e06a'], [1, '#f4ffd6']] },
        ];
        let currentColorIdx = 0;

        function stopsToCSS(stops) {
            return 'linear-gradient(to right,' + stops.map(s => `${s[1]} ${(s[0] * 100).toFixed(0)}%`).join(',') + ')';
        }

        // --- 构建下拉框 ---
        function buildDropdown() {
            const list = document.getElementById('ddList');
            colorPresets.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'dd-item' + (i === currentColorIdx ? ' sel' : '');
                item.innerHTML = `<span class="check">${i === currentColorIdx ? '●' : ''}</span><span class="name">${p.name}</span><div class="gradbar" style="background:${stopsToCSS(p.stops)}"></div>`;
                item.onclick = () => selectPreset(i);
                list.appendChild(item);
            });
            refreshDDHead();
        }
        function refreshDDHead() {
            const p = colorPresets[currentColorIdx];
            document.getElementById('ddName').innerText = p.name;
            document.getElementById('ddBar').style.background = stopsToCSS(p.stops);
        }
        function toggleDD() { document.getElementById('dd').classList.toggle('open'); }
        function selectPreset(i) {
            currentColorIdx = i;
            document.querySelectorAll('.dd-item').forEach((el, j) => {
                el.classList.toggle('sel', j === i);
                el.querySelector('.check').innerText = j === i ? '●' : '';
            });
            refreshDDHead();
            updateGradientTexture();
            document.getElementById('dd').classList.remove('open');
        }
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.dd')) document.getElementById('dd').classList.remove('open');
        });

        // --- 渐变色带 → GPU 纹理 (256x1) ---
        function updateGradientTexture() {
            const p = colorPresets[currentColorIdx];
            const cnv = document.createElement('canvas');
            cnv.width = 256; cnv.height = 1;
            const ctx = cnv.getContext('2d');
            const g = ctx.createLinearGradient(0, 0, 256, 0);
            p.stops.forEach(s => g.addColorStop(s[0], s[1]));
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 256, 1);
            if (gradTex) gl.deleteTexture(gradTex);
            gradTex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, gradTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, ctx.getImageData(0, 0, 256, 1));
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        }

        // --- 贴图模式切换 ---
        function setTexMode(m) {
            texMode = m;
            document.getElementById('modeGrad').classList.toggle('active', m === 'gradient');
            document.getElementById('modeImg').classList.toggle('active', m === 'image');
            document.getElementById('gradSection').style.display = m === 'gradient' ? 'block' : 'none';
            document.getElementById('imgSection').style.display = m === 'image' ? 'block' : 'none';
            if (m === 'image' && !imgTex) loadRandomImage();
        }

        // --- 网络随机图片纹理 ---
        const fallbackImages = [
            'https://picsum.photos/id/1015/512/512',
            'https://picsum.photos/id/1025/512/512',
            'https://picsum.photos/id/1043/512/512',
            'https://picsum.photos/id/1062/512/512'
        ];
        function uploadImageTexture(img) {
            if (imgTex) gl.deleteTexture(imgTex);
            imgTex = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, imgTex);
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            gl.generateMipmap(gl.TEXTURE_2D);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        }
        function loadRandomImage() {
            const tag = document.getElementById('imgTag');
            tag.innerText = '加载中...';
            const url = `https://picsum.photos/seed/dem${Date.now()}${Math.floor(Math.random() * 9999)}/512/512`;
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
                uploadImageTexture(img);
                document.getElementById('previewImg').src = url;
                tag.innerText = `512 × 512 · 已就绪`;
            };
            img.onerror = () => {
                // 随机 seed 失败时回退到固定图库
                const fb = fallbackImages[Math.floor(Math.random() * fallbackImages.length)];
                const img2 = new Image();
                img2.crossOrigin = 'anonymous';
                img2.onload = () => {
                    uploadImageTexture(img2);
                    document.getElementById('previewImg').src = fb;
                    tag.innerText = `512 × 512 · 已就绪`;
                };
                img2.src = fb;
            };
            img.src = url;
        }

        // --- UI 事件绑定 ---
        document.getElementById('zSlider').oninput = (e) => {
            zScale = e.target.value / 10.0;
            document.getElementById('zVal').innerText = zScale.toFixed(1);
        };
        document.getElementById('resSlider').oninput = (e) => {
            currentRes = parseInt(e.target.value);
            document.getElementById('resVal').innerText = currentRes;
            if (heightTex) generateBuffers(currentRes);
        };
        document.getElementById('resetBtn').onclick = () => {
            viewState = { rotX: -0.9, rotZ: 0, dist: 20 };
        };
        document.getElementById('chkContour').onchange = (e) => showContour = e.target.checked;
        document.getElementById('chkRotate').onchange = (e) => autoRotate = e.target.checked;
        const modeBtn = document.getElementById('modeBtn');
        modeBtn.onclick = () => {
            isWireframe = !isWireframe;
            modeBtn.innerText = isWireframe ? '/ 线框模式' : '■ 面片模式';
            if (heightTex) generateBuffers(currentRes);
        };

        // --- 鼠标交互 ---
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouse.x = e.clientX;
            lastMouse.y = e.clientY;
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouse.x;
            const dy = e.clientY - lastMouse.y;
            viewState.rotZ += dx * 0.01;
            viewState.rotX += dy * 0.01;
            lastMouse.x = e.clientX;
            lastMouse.y = e.clientY;
        });
        canvas.addEventListener('wheel', (e) => {
            viewState.dist += e.deltaY * 0.05;
            viewState.dist = Math.max(1, Math.min(100, viewState.dist));
            e.preventDefault();
        }, { passive: false });

        // --- 核心逻辑：处理数据 ---
        function handleData(buffer, fileName) {
            document.getElementById('status').innerHTML = '<span class="loading">正在解析地形数据...</span>';
            if (currentWorker) currentWorker.terminate();
            if (heightTex) { gl.deleteTexture(heightTex); heightTex = null; }
            if (currentBuffers) { gl.deleteBuffer(currentBuffers.u); gl.deleteBuffer(currentBuffers.i); currentBuffers = null; }

            const workerStart = performance.now();
            currentWorker = new Worker('worker.js');
            currentWorker.postMessage({ buffer });
            currentWorker.onmessage = (msg) => {
                if (msg.data.error) {
                    document.getElementById('status').innerText = '❌ 错误: ' + msg.data.error;
                    return alert(msg.data.error);
                }
                const { data, width, height, min, max } = msg.data;
                const tWorker = performance.now() - workerStart;
                document.getElementById('t_worker').innerText = tWorker.toFixed(1) + "ms";

                // 上传显存
                const gpuStart = performance.now();
                heightTex = gl.createTexture();
                gl.bindTexture(gl.TEXTURE_2D, heightTex);
                gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
                gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, width, height, 0, gl.RED, gl.FLOAT, new Float32Array(data));
                const hFilter = floatLinear ? gl.LINEAR : gl.NEAREST;
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, hFilter);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, hFilter);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
                gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
                heightW = width; heightH = height;
                const tGpu = performance.now() - gpuStart;
                document.getElementById('t_gpu').innerText = tGpu.toFixed(1) + "ms";

                sceneMin = min;
                sceneMax = max;
                document.getElementById('legMin').innerText = min.toFixed(0);
                document.getElementById('legMax').innerText = max.toFixed(0);
                document.getElementById('debug').innerHTML = `尺寸: ${width}x${height}<br>海拔: ${min.toFixed(2)} ~ ${max.toFixed(2)}`;
                document.getElementById('status').innerHTML = '✅ 加载完成: ' + fileName;
                generateBuffers(currentRes);
            };
        }

        // --- 加载远程/同目录文件 ---
        async function loadRemoteFile(url) {
            document.getElementById('status').innerText = '正在请求: ' + url;
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const arrayBuffer = await response.arrayBuffer();
                handleData(arrayBuffer, url);
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = '❌ 加载失败';
                alert('无法加载文件: ' + url + '\n\n可能原因：\n1. 文件不存在于当前目录。\n2. 浏览器安全策略限制 (请尝试使用本地服务器运行，而非直接双击打开 html)。');
            }
        }

        // --- 本地文件上传 ---
        document.getElementById('fileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                handleData(evt.target.result, file.name);
            };
            reader.readAsArrayBuffer(file);
        };

        // --- 网格生成 ---
        function generateBuffers(res) {
            if (currentBuffers) {
                gl.deleteBuffer(currentBuffers.u);
                gl.deleteBuffer(currentBuffers.i);
            }
            const uvs = [];
            const idx = [];
            for (let y = 0; y <= res; y++) {
                for (let x = 0; x <= res; x++) {
                    uvs.push(x / res, y / res);
                }
            }
            if (isWireframe) {
                for (let y = 0; y <= res; y++) {
                    for (let x = 0; x < res; x++) {
                        const i = y * (res + 1) + x;
                        idx.push(i, i + 1);
                    }
                }
                for (let x = 0; x <= res; x++) {
                    for (let y = 0; y < res; y++) {
                        const i = y * (res + 1) + x;
                        idx.push(i, i + res + 1);
                    }
                }
            } else {
                for (let y = 0; y < res; y++) {
                    for (let x = 0; x < res; x++) {
                        const i = y * (res + 1) + x;
                        idx.push(i, i + res + 1, i + res + 2);
                        idx.push(i, i + res + 2, i + 1);
                    }
                }
            }
            const uB = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, uB);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(uvs), gl.STATIC_DRAW);
            const iB = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, iB);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
            currentBuffers = { u: uB, i: iB, count: idx.length };
        }

        // --- 着色器：顶点着色器内做中心差分求法线，供片元做光照 ---
        const vsSource = `#version 300 es
        in vec2 aUV;
        uniform mat4 uP, uMV;
        uniform sampler2D uTex;
        uniform vec2 uTexel;
        uniform float uMin, uMax, uZ;
        out float vH;
        out vec2 vUV;
        out vec3 vNormal;
        out float vDist;
        void main() {
            float h  = texture(uTex, aUV).r;
            float hR = texture(uTex, aUV + vec2(uTexel.x, 0.0)).r;
            float hL = texture(uTex, aUV - vec2(uTexel.x, 0.0)).r;
            float hT = texture(uTex, aUV + vec2(0.0, uTexel.y)).r;
            float hB = texture(uTex, aUV - vec2(0.0, uTexel.y)).r;
            float range = uMax - uMin + 0.0001;
            vH = (h - uMin) / range;
            float z = vH * uZ;
            // 世界坐标步长: UV 每步 = 15 * uTexel，高差归一化后 * uZ
            float dzdx = ((hR - hL) / range) * uZ / (2.0 * uTexel.x * 15.0 + 0.0001);
            float dzdy = ((hT - hB) / range) * uZ / (2.0 * uTexel.y * 15.0 + 0.0001);
            // 法线转到视角空间：光照跟随相机，旋转视角时地形始终被照亮
            vNormal = mat3(uMV) * normalize(vec3(-dzdx, -dzdy, 1.0));
            vec4 pos = vec4((aUV.x - 0.5) * 15.0, (aUV.y - 0.5) * 15.0, z, 1.0);
            vec4 viewPos = uMV * pos;
            vDist = length(viewPos.xyz);
            vUV = aUV;
            gl_Position = uP * viewPos;
        }`;

        // --- 片元着色器：渐变色带 / 图片纹理 双模式 + 光照 + 等高线 + 距离雾 ---
        const fsSource = `#version 300 es
        precision highp float;
        in float vH;
        in vec2 vUV;
        in vec3 vNormal;
        in float vDist;
        uniform sampler2D uGradTex;   // 纹理单元 1：渐变色带 256x1
        uniform sampler2D uImgTex;    // 纹理单元 2：图片纹理
        uniform int uMode;            // 0=渐变 1=图片
        uniform int uWire;            // 是否线框模式
        uniform int uContour;         // 是否等高线
        uniform vec3 uBg;             // 背景色（雾色）
        out vec4 fC;
        void main() {
            vec3 base = (uMode == 1)
                ? texture(uImgTex, vUV).rgb
                : texture(uGradTex, vec2(clamp(vH, 0.0, 1.0), 0.5)).rgb;

            vec3 col;
            if (uWire == 1) {
                // 线框：按高度取色并轻微提亮，保留霓虹感
                col = base * 1.35 + vec3(0.04);
            } else {
                // 面片：视角空间光照 + Half-Lambert，背光面不死黑，整体亮度接近线框
                vec3 n = normalize(vNormal);
                vec3 L = normalize(vec3(0.38, 0.46, 0.80)); // 从相机方向斜上方打光
                float lambert = dot(n, L);
                float halfLambert = lambert * 0.5 + 0.5;    // 0.5~1.0，永不全黑
                float amb = 0.42;
                vec3 V = vec3(0.0, 0.0, 1.0);
                float spec = pow(max(dot(reflect(-L, n), V), 0.0), 24.0) * 0.25;
                col = base * (amb + 0.58 * halfLambert) + spec;
                // 等高线（抗锯齿）
                if (uContour == 1) {
                    float lv = vH * 24.0;
                    float d = abs(fract(lv - 0.5) - 0.5) / max(fwidth(lv), 0.0001);
                    float line = 1.0 - min(d, 1.0);
                    col = mix(col, col * 0.35, line * 0.75);
                }
            }
            // 距离雾：远处融入背景（减淡，避免压暗整体）
            float fog = smoothstep(26.0, 72.0, vDist);
            col = mix(col, uBg, fog * 0.6);
            fC = vec4(col, 1.0);
        }`;

        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error(gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const prg = gl.createProgram();
        gl.attachShader(prg, compileShader(gl.VERTEX_SHADER, vsSource));
        gl.attachShader(prg, compileShader(gl.FRAGMENT_SHADER, fsSource));
        gl.linkProgram(prg);
        if (!gl.getProgramParameter(prg, gl.LINK_STATUS)) {
            console.error(gl.getProgramInfoLog(prg));
            alert('着色器链接失败: ' + gl.getProgramInfoLog(prg));
        }
        gl.useProgram(prg);

        const loc = {
            aUV: gl.getAttribLocation(prg, 'aUV'),
            uP: gl.getUniformLocation(prg, 'uP'),
            uMV: gl.getUniformLocation(prg, 'uMV'),
            uTex: gl.getUniformLocation(prg, 'uTex'),
            uTexel: gl.getUniformLocation(prg, 'uTexel'),
            uMin: gl.getUniformLocation(prg, 'uMin'),
            uMax: gl.getUniformLocation(prg, 'uMax'),
            uZ: gl.getUniformLocation(prg, 'uZ'),
            uGradTex: gl.getUniformLocation(prg, 'uGradTex'),
            uImgTex: gl.getUniformLocation(prg, 'uImgTex'),
            uMode: gl.getUniformLocation(prg, 'uMode'),
            uWire: gl.getUniformLocation(prg, 'uWire'),
            uContour: gl.getUniformLocation(prg, 'uContour'),
            uBg: gl.getUniformLocation(prg, 'uBg')
        };

        gl.enableVertexAttribArray(loc.aUV);
        gl.uniform1i(loc.uTex, 0);
        gl.uniform1i(loc.uGradTex, 1);
        gl.uniform1i(loc.uImgTex, 2);

        // --- 初始化渐变色带 & 下拉框 ---
        buildDropdown();
        updateGradientTexture();

        // --- 运行时错误显示到状态栏，便于自查 ---
        window.onerror = (msg, src, line) => {
            const s = document.getElementById('status');
            s.innerHTML = '<span class="loading">JS错误: ' + msg + ' @' + line + '</span>';
        };

        // --- 渲染循环 ---
        let lastT = performance.now();
        function render() {
            requestAnimationFrame(render);
            const now = performance.now();
            const dt = (now - lastT) / 1000;
            lastT = now;
            if (autoRotate && !isDragging) viewState.rotZ += dt * 0.25;

            gl.viewport(0, 0, canvas.width, canvas.height);
            gl.clearColor(0.016, 0.024, 0.043, 1.0);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);

            if (!heightTex || !currentBuffers) return;

            const aspect = canvas.width / canvas.height;
            const proj = mat4.create();
            mat4.perspective(proj, Math.PI / 4, aspect, 0.1, 100.0);
            const mv = mat4.create();
            mat4.translate(mv, mv, [0, 0, -viewState.dist]);
            mat4.rotateX(mv, mv, viewState.rotX);
            mat4.rotateZ(mv, mv, viewState.rotZ);

            gl.uniformMatrix4fv(loc.uP, false, proj);
            gl.uniformMatrix4fv(loc.uMV, false, mv);
            gl.uniform1f(loc.uMin, sceneMin);
            gl.uniform1f(loc.uMax, sceneMax);
            gl.uniform1f(loc.uZ, zScale);
            gl.uniform2f(loc.uTexel, 1.0 / heightW, 1.0 / heightH);
            gl.uniform1i(loc.uMode, texMode === 'image' ? 1 : 0);
            gl.uniform1i(loc.uWire, isWireframe ? 1 : 0);
            gl.uniform1i(loc.uContour, showContour ? 1 : 0);
            gl.uniform3f(loc.uBg, 0.016, 0.024, 0.043);

            // 纹理单元绑定：0=高度 1=渐变色带 2=图片
            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, heightTex);
            gl.activeTexture(gl.TEXTURE1);
            gl.bindTexture(gl.TEXTURE_2D, gradTex);
            gl.activeTexture(gl.TEXTURE2);
            if (imgTex) gl.bindTexture(gl.TEXTURE_2D, imgTex);

            gl.bindBuffer(gl.ARRAY_BUFFER, currentBuffers.u);
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, currentBuffers.i);
            gl.vertexAttribPointer(loc.aUV, 2, gl.FLOAT, false, 0, 0);

            if (isWireframe) {
                gl.drawElements(gl.LINES, currentBuffers.count, gl.UNSIGNED_INT, 0);
            } else {
                gl.drawElements(gl.TRIANGLES, currentBuffers.count, gl.UNSIGNED_INT, 0);
            }
        }
        render();

        // 页面加载完成调数据
        window.onload = () => {
            loadRemoteFile('1000.tif');
        };

        // --- 窗口自适应 ---
        window.onresize = () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        };
        window.onresize();
    </script>
</body>
</html>
