<!DOCTYPE html>
<html>
  <head>
    <title>GridLayer Optimized</title>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body {
        padding: 0;
        margin: 0;
      }

      html,
      body,
      #map {
        height: 100%;
        width: 100%;
      }
    </style>
  </head>

  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // 北斗网格位置码Leaflet绘制实现  https://blog.csdn.net/this_is_id/article/details/154950389
      // LeaFlet学习之GridLayer扩展   https://blog.csdn.net/weixin_40184249/article/details/81173064
      var map = new L.Map("map", {
        center: [35.43507, 139.43538726009422],
        zoom: 5,
        CRS: L.CRS.EPSG4326,
      });
      let gridLayerGroup = null;
      // 防抖句柄，避免连续触发时频繁重绘
      let drawTimer = null;

      L.tileLayer(
        "https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=a76b9ea6e49fb0eecdb1ed34d1e75930",
        { subdomains: ["0", "1", "2", "3", "4", "5", "6", "7"] },
      ).addTo(map);

      const zoomToLevel = (zoom) => {
        // if (zoom >= 5 && zoom <= 6) {
        if ( zoom <= 6) {
          return 1;
        } else if (zoom >= 7 && zoom <= 8) {
          return 2;
        } else if (zoom >= 9 && zoom <= 10) {
          return 3;
        } else if (zoom >= 11 && zoom <= 12) {
          return 4;
        } else if (zoom >= 13 && zoom <= 14) {
          return 5;
        } else if (zoom >= 15 && zoom <= 16) {
          return 6;
        } else if (zoom >= 17 && zoom <= 18) {
          return 7;
        } else if (zoom >= 19 && zoom <= 20) {
          return 8;
        } else if (zoom >= 21 && zoom <= 22) {
          return 9;
        } else if (zoom >= 23 && zoom <= 24) {
          return 10;
        }
      };

      const getStepByLevel = (level) => {
        switch (level) {
          case 1:
            return { lngStep: 6, latStep: 4 };
          case 2:
            return { lngStep: 30 / 60, latStep: 30 / 60 };
          case 3:
            return { lngStep: 15 / 60, latStep: 15 / 60 };
          case 4:
            return { lngStep: 1 / 60, latStep: 1 / 60 };
          case 5:
            return { lngStep: 4 / 60 / 60, latStep: 4 / 60 / 60 };
          case 6:
            return { lngStep: 2 / 60 / 60, latStep: 2 / 60 / 60 };
          case 7:
            return { lngStep: 1 / 4 / 60 / 60, latStep: 1 / 4 / 60 / 60 };
          case 8:
            return { lngStep: 1 / 32 / 60 / 60, latStep: 1 / 32 / 60 / 60 };
          case 9:
            return { lngStep: 1 / 256 / 60 / 60, latStep: 1 / 256 / 60 / 60 };
          case 10:
            return {
              lngStep: 1 / 2048 / 60 / 60,
              latStep: 1 / 2048 / 60 / 60,
            };
          default:
            return null;
        }
      };

      function drawGrid() {
        const zoom = map.getZoom();
        if (zoom < 2) {
          if (gridLayerGroup) {
            map.removeLayer(gridLayerGroup);
            gridLayerGroup = null;
          }
          return;
        }

        const level = zoomToLevel(zoom);
        const steps = getStepByLevel(level);
        if (!steps) return;
        const { lngStep, latStep } = steps;

        // 获取当前视图范围（经纬度 bounds）
        const bounds = map.getBounds();
        const west = bounds.getWest();
        const east = bounds.getEast();
        const south = bounds.getSouth();
        const north = bounds.getNorth();

        // 向外多扩展 1~2 个步长，避免边缘出现空白
        const padLng = lngStep * 2;
        const padLat = latStep * 2;
        const minLng = Math.max(-180, west - padLng);
        const maxLng = Math.min(180, east + padLng);
        const minLat = Math.max(-88, south - padLat);
        const maxLat = Math.min(88, north + padLat);

        // 清理旧的图层
        if (gridLayerGroup) {
          map.removeLayer(gridLayerGroup);
        }
        gridLayerGroup = new L.LayerGroup();

        const lineStyle = { color: "#888", weight: 1, opacity: 1 };

        // 从第一条 >= minLng 的网格线开始，对齐到步长
        let startLng = Math.ceil(minLng / lngStep) * lngStep;
        for (let lon = startLng; lon <= maxLng; lon += lngStep) {
          // 每条经线只画视图内的纬度范围
          gridLayerGroup.addLayer(
            new L.Polyline(
              [
                [minLat, lon],
                [maxLat, lon],
              ],
              lineStyle,
            ),
          );
        }

        let startLat = Math.ceil(minLat / latStep) * latStep;
        for (let lat = startLat; lat <= maxLat; lat += latStep) {
          // 每条纬线只画视图内的经度范围
          gridLayerGroup.addLayer(
            new L.Polyline(
              [
                [lat, minLng],
                [lat, maxLng],
              ],
              lineStyle,
            ),
          );
        }

        gridLayerGroup.addTo(map);
      }

      // 防抖触发重绘
      const scheduleDraw = () => {
        if (drawTimer) {
          clearTimeout(drawTimer);
        }
        drawTimer = setTimeout(() => {
          drawTimer = null;
          drawGrid();
        }, 150);
      };

      map.on("zoomend", scheduleDraw);
      map.on("moveend", scheduleDraw);

      // 初始化绘制
      map.whenReady(drawGrid);
    </script>
  </body>
</html>
