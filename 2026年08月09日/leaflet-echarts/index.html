<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet + ECharts Overlay Demo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      .tip {
        position: absolute;
        bottom: 12px;
        left: 10px;
        z-index: 9999;
        padding: 8px 12px;
        border-radius: 6px;
        background: rgba(15, 23, 42, 0.82);
        color: #fff;
        font:
          13px/1.4 Arial,
          sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div class="tip">Leaflet 自己初始化，ECharts 只做叠加显示</div>

    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="./leaflet-echarts.js"></script>
    <script>
      var map = L.map("map", {
        zoomControl: true,
        attributionControl: true,
      }).setView([34.25, 108.95], 5);

      let url = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

      url =
        "https://t{s}.tianditu.gov.cn/vec_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=vec&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}&tk=a76b9ea6e49fb0eecdb1ed34d1e75930";
      L.tileLayer(url, {
        attribution: "&copy; OpenStreetMap contributors",
    subdomains: ["0", "1", "2", "3", "4", "5", "6", "7"],
      }).addTo(map);

      var cityData = [
        { name: "北京", value: [116.4074, 39.9042, 95] },
        { name: "上海", value: [121.4737, 31.2304, 90] },
        { name: "广州", value: [113.2644, 23.1291, 85] },
        { name: "深圳", value: [114.0579, 22.5431, 82] },
        { name: "西安", value: [108.9398, 34.3416, 76] },
        { name: "成都", value: [104.0665, 30.5723, 72] },
      ];

      var lineData = [
        {
          coords: [
            [108.9398, 34.3416],
            [116.4074, 39.9042],
          ],
        },
        {
          coords: [
            [108.9398, 34.3416],
            [121.4737, 31.2304],
          ],
        },
        {
          coords: [
            [108.9398, 34.3416],
            [113.2644, 23.1291],
          ],
        },
      ];

      var overlay = L.echartsLayer(map, echarts, {
        renderOnMoving: false,
        renderOnZooming: false,
      });

      overlay.setOption({
        animation: true,
        tooltip: {
          trigger: "item",
        },
        series: [
          {
            name: "迁移线",
            type: "lines",
            coordinateSystem: "leaflet",
            polyline: false,
            data: lineData,
            lineStyle: {
              color: "#f59e0b",
              width: 2,
              opacity: 0.85,
              curveness: 0.2,
            },
            effect: {
              show: true,
              symbol: "arrow",
              constantSpeed: 30,
              trailLength: 0.2,
              symbolSize: 8,
            },
            zlevel: 1,
          },
          {
            name: "城市",
            type: "effectScatter",
            data: cityData,
            rippleEffect: {
              brushType: "stroke",
            },
            symbolSize: function (val) {
              return Math.max(12, val[2] / 6);
            },
            itemStyle: {
              color: "#38bdf8",
              shadowBlur: 12,
              shadowColor: "rgba(56, 189, 248, 0.45)",
            },
            label: {
              show: true,
              position: "right",
              formatter: "{b}",
              color: "#111827",
            },
            zlevel: 2,
          },
        ],
      });


      // setTimeout(() => {
      //   overlay.remove()
      // }, 10000);
    </script>
  </body>
</html>
